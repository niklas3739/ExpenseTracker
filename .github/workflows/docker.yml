name: Build and Publish Docker Images

on:
  push:
    #branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          REPO_OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=$REPO_OWNER_LC" >> $GITHUB_OUTPUT
          SHORT_SHA=${GITHUB_SHA::7}
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          # repo root as context, dockefile in expense_tracker/api
          context: .
          file: expense_tracker/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/expense-tracker-api:latest
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/expense-tracker-api:${{ steps.meta.outputs.short_sha }}

      - name: Build & push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/expense-tracker-frontend:latest
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/expense-tracker-frontend:${{ steps.meta.outputs.short_sha }}
