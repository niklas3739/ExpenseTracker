<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Group Expense Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{font-family:system-ui,Arial,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem}
    h2{margin-top:2rem}
    label{display:block;margin:.25rem 0}
    input,select,button,textarea{margin:.25rem 0 .75rem 0;padding:.5rem}
    .card{border:1px solid #ddd;border-radius:8px;padding:1rem;margin:.75rem 0}
    pre{background:#f6f8fa;padding:.75rem;border-radius:6px;overflow:auto}
  </style>
</head>
<body>
  <h1>Group Expense Tracker</h1>

  <div class="card">
    <h2>Create Group</h2>
    <label>Group name <input id="g-name" placeholder="Trip to Rome"></label>
    <label>Members (comma separated) <input id="g-members" placeholder="alice,bob,carol"></label>
    <button onclick="createGroup()">Create Group</button>
    <div id="g-result"></div>
  </div>

  <div class="card">
    <h2>Add Expense</h2>
    <label>Group ID <input id="e-gid" type="number" value="1"></label>
    <label>Payer ID <input id="e-payer" placeholder="alice"></label>
    <label>Amount <input id="e-amount" type="number" step="0.01" value="60"></label>
    <label>Description <input id="e-desc" placeholder="Dinner"></label>
    <label>Date <input id="e-date" type="date"></label>
    <label>Split Type
      <select id="e-type">
        <option value="equal">equal</option>
        <option value="shares">shares</option>
        <option value="percent">percent</option>
      </select>
    </label>
    <label>Splits JSON
      <textarea id="e-splits" rows="4" placeholder='[{"user_id":"alice"},{"user_id":"bob"},{"user_id":"carol"}]'></textarea>
    </label>
    <button onclick="addExpense()">Add Expense</button>
    <div id="e-result"></div>
  </div>

  <div class="card">
    <h2>List Expenses</h2>
    <label>Group ID <input id="l-gid" type="number" value="1"></label>
    <button onclick="listExpenses()">Load</button>
    <pre id="l-result"></pre>
  </div>

  <div class="card">
    <h2>Group Balance</h2>
    <label>Group ID <input id="b-gid" type="number" value="1"></label>
    <button onclick="getBalance()">Compute</button>
    <pre id="b-result"></pre>
  </div>

  <script>
    const API = location.origin; // same origin if served by FastAPI

    async function createGroup() {
      const name = document.getElementById('g-name').value.trim();
      const members = (document.getElementById('g-members').value || '')
        .split(',').map(s => s.trim()).filter(Boolean);

      const res = await fetch(`${API}/groups/`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ name, members })
      });
      document.getElementById('g-result').textContent = await res.text();
    }

    async function addExpense() {
      const gid = document.getElementById('e-gid').value;
      const payload = {
        payer_id: document.getElementById('e-payer').value.trim(),
        amount: parseFloat(document.getElementById('e-amount').value),
        description: document.getElementById('e-desc').value.trim(),
        date: document.getElementById('e-date').value || new Date().toISOString().slice(0,10),
        split_type: document.getElementById('e-type').value,
        splits: JSON.parse(document.getElementById('e-splits').value || '[]')
      };

      const res = await fetch(`${API}/groups/${gid}/expenses`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      document.getElementById('e-result').textContent = await res.text();
    }

    async function listExpenses() {
      const gid = document.getElementById('l-gid').value;
      const res = await fetch(`${API}/groups/${gid}/expenses`);
      document.getElementById('l-result').textContent = JSON.stringify(await res.json(), null, 2);
    }

    async function getBalance() {
      const gid = document.getElementById('b-gid').value;
      const res = await fetch(`${API}/groups/${gid}/balance`);
      document.getElementById('b-result').textContent = JSON.stringify(await res.json(), null, 2);
    }
  </script>
</body>
</html>
